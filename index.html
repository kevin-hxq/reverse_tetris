    function trim(m){let top=m.findIndex(row=>row.some(Boolean)),bottom=m.length-1;while(bottom>=top&&!m[bottom].some(Boolean))bottom--;let left=m[0].length,right=-1;for(let r=top;r<=bottom;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]){left=Math.min(left,c);right=Math.max(right,c)}return m.slice(top,bottom+1).map(row=>row.slice(left,right+1))}
    function rotations(type){let s=trim(PIECES[type].s),arr=[],seen=new Set();for(let i=0;i<4;i++){const key=s.map(row=>row.join('')).join('/');if(!seen.has(key)){seen.add(key);arr.push(s)}s=trim(rotate(s))}return arr}
    function collide(m,p){for(let r=0;r<p.s.length;r++)for(let c=0;c<p.s[r].length;c++)if(p.s[r][c]){let x=p.x+c,y=p.y+r;if(x<0||x>=COLS||y>=ROWS||(y>=0&&m[y][x]))return true}return false}
    function merge(m,p){for(let r=0;r<p.s.length;r++)for(let c=0;c<p.s[r].length;c++)if(p.s[r][c]&&p.y+r>=0&&p.y+r<ROWS&&p.x+c>=0&&p.x+c<COLS)m[p.y+r][p.x+c]=p.color}
    function clear(m){let n=0;for(let r=ROWS-1;r>=0;r--)if(m[r].every(Boolean)){m.splice(r,1);m.unshift(Array(COLS).fill(0));n++;r++}return n}
    function evaluate(m,cleared=0){let heights=Array(COLS).fill(0),holes=0;for(let c=0;c<COLS;c++){let found=false;for(let r=0;r<ROWS;r++)if(m[r][c]){if(!found){heights[c]=ROWS-r;found=true}}else if(found)holes++}const aggregate=heights.reduce((a,b)=>a+b,0),maxHeight=Math.max(...heights);let bump=heights[0]+heights[COLS-1];for(let c=0;c<COLS-1;c++)bump+=Math.abs(heights[c]-heights[c+1]);
      // 一步启发式：评估当前方块落地、消行后的真实盘面；不预测后续方块。
      // 使用常见的高度/空洞/凹凸度权重，并额外加重接近触顶的风险。
      const score=.760666*cleared-.510066*aggregate-.35663*holes-.184483*bump-.22*maxHeight*maxHeight;
      return{score,max:maxHeight,holes,bump,aggregateHeight:aggregate}}
    function bestMove(type){let best=null,bestScore=-Infinity,bestCenter=Infinity,states=rotations(type);for(let ri=0;ri<states.length;ri++){const s=states[ri];for(let x=0;x<=COLS-s[0].length;x++){let p={s,x,y:0,color:PIECES[type].c};if(collide(board,p))continue;while(!collide(board,{...p,y:p.y+1}))p.y++;let sim=clone(board);merge(sim,p);const cleared=clear(sim),features=evaluate(sim,cleared),centerDistance=Math.abs(x+s[0].length/2-COLS/2);if(features.score>bestScore+1e-7||(Math.abs(features.score-bestScore)<=1e-7&&centerDistance<bestCenter)){bestScore=features.score;bestCenter=centerDistance;best={...p,rotationIndex:ri}}}}return best}
    function block(x,y,color,border='#ffffff55'){ctx.fillStyle=color;ctx.fillRect(x*SIZE+1,y*SIZE+1,SIZE-2,SIZE-2);ctx.fillStyle='#ffffff26';ctx.fillRect(x*SIZE+1,y*SIZE+1,SIZE-2,4);ctx.fillRect(x*SIZE+1,y*SIZE+1,4,SIZE-2);ctx.strokeStyle=border;ctx.strokeRect(x*SIZE+1.5,y*SIZE+1.5,SIZE-3,SIZE-3)}
    function draw(){ctx.fillStyle='#020617';ctx.fillRect(0,0,BOARD_WIDTH,BOARD_HEIGHT);ctx.strokeStyle='#1e293b';ctx.lineWidth=.5;for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*SIZE);ctx.lineTo(BOARD_WIDTH,r*SIZE);ctx.stroke()}for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*SIZE,0);ctx.lineTo(c*SIZE,BOARD_HEIGHT);ctx.stroke()}for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c])block(c,r,board[r][c]);if(turn&&piece){ctx.save();ctx.globalAlpha=.24;for(let r=0;r<turn.move.s.length;r++)for(let c=0;c<turn.move.s[r].length;c++)if(turn.move.s[r][c]){ctx.fillStyle=piece.color;ctx.fillRect((turn.move.x+c)*SIZE+3,(turn.move.y+r)*SIZE+3,SIZE-6,SIZE-6)}ctx.restore()}if(piece)for(let r=0;r<piece.s.length;r++)for(let c=0;c<piece.s[r].length;c++)if(piece.s[r][c])block(piece.x+c,piece.y+r,piece.color,piece.border)}
       function select(type){if(over||!availablePieces.has(type))return;selected=type;if(!firstPickTipSeen){firstPickTipSeen=true;showFirstPickTip()}else updateGuide();renderCards()}
     function renderCards(){const root=$('pieceCards');root.innerHTML='';for(const [k,p] of Object.entries(PIECES)){const used=!availablePieces.has(k),b=document.createElement('button');b.type='button';b.className='card'+(selected===k?' selected':'')+(used?' used':'');b.disabled=used;b.setAttribute('aria-label',TEXT[language].pieceNames[k]);b.innerHTML='<canvas width="48" height="48" aria-hidden="true"></canvas>';b.onclick=()=>select(k);const shape=trim(p.s),cell=10,ox=(48-shape[0].length*cell)/2,oy=(48-shape.length*cell)/2,c=b.querySelector('canvas').getContext('2d');for(let r=0;r<shape.length;r++)for(let x=0;x<shape[r].length;x++)if(shape[r][x]){c.fillStyle=p.c;c.fillRect(ox+x*cell+0.5,oy+r*cell+0.5,9,9)}root.appendChild(b)}}
        function gameOver(){if(over)return;over=true;clearGuideTimer();cancelAnimationFrame(raf);guideOpen=false;updateGuide();$('aiStatus').textContent=text('gameOver');const isNewBest=!bestResult||dealt<bestResult.pieces||(dealt===bestResult.pieces&&lines<bestResult.lines);if(isNewBest){bestResult={pieces:dealt,lines};try{localStorage.setItem(BEST_KEY,JSON.stringify(bestResult))}catch{}}updateBestResult();$('newBestLabel').classList.toggle('hidden',!isNewBest);$('gameModal').classList.remove('hidden');confetti()}
    function confetti(){let bits=[];for(let i=0;i<100;i++)bits.push({x:Math.random()*BOARD_WIDTH,y:-Math.random()*BOARD_HEIGHT,v:2+Math.random()*4,c:Object.values(PIECES)[i%7].c});let start=performance.now();function frame(now){draw();for(let b of bits){b.y+=b.v;b.x+=Math.sin((now-start)/250+b.y/30);ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,4,7)}if(now-start<2200)requestAnimationFrame(frame);else draw()}requestAnimationFrame(frame)}
    function fitBoard(){const maxWidth=Math.max(120,Math.min(280,window.innerWidth-56)),maxHeight=Math.max(160,window.innerHeight*(window.innerWidth<=780?.58:.72)),cell=Math.min(SIZE,maxWidth/COLS,maxHeight/ROWS);canvas.style.width=`${COLS*cell}px`;canvas.style.height=`${ROWS*cell}px`}
      function startTurn(now){if(!selected)return;const type=selected;selected=null;availablePieces.delete(type);piece={s:PIECES[type].s,x:Math.floor((COLS-PIECES[type].s[0].length)/2),y:0,type,color:PIECES[type].c,border:PIECES[type].b};dealt++;$('totalCardsDealt').textContent=dealt;renderCards();if(collide(board,piece)){gameOver();return}const move=bestMove(type);if(!move){gameOver();return}piece.s=move.s;turn={move,startX:piece.x,startedAt:now,duration:Math.max(500,Math.min(1400,move.y*65))};$('aiStatus').textContent=text('aiTurn')}
      function finishTurn(){merge(board,piece);const cleared=clear(board);lines+=cleared;$('totalLinesCleared').textContent=lines;piece=null;turn=null;if(availablePieces.size===0)availablePieces=new Set(Object.keys(PIECES));renderCards();$('aiStatus').textContent=text('choose')}
    function advanceTurn(now){if(!turn||!piece)return;const progress=Math.min(1,(now-turn.startedAt)/turn.duration);piece.x=turn.startX+(turn.move.x-turn.startX)*progress;piece.y=turn.move.y*progress;if(progress>=1){piece.x=turn.move.x;piece.y=turn.move.y;finishTurn()}}
    function loop(t){if(!over){if(turn)advanceTurn(t);else if(selected)startTurn(t)}draw();if(!over)raf=requestAnimationFrame(loop)}
       function reset(){board=matrix();piece=null;selected=null;turn=null;over=false;lines=0;dealt=0;availablePieces=new Set(Object.keys(PIECES));$('totalCardsDealt').textContent='0';$('totalLinesCleared').textContent='0';$('gameModal').classList.add('hidden');$('aiStatus').textContent=text('choose');cancelAnimationFrame(raf);updateGuide();renderCards();draw();raf=requestAnimationFrame(loop)}
         bestResult=readBestResult();try{guideOpen=localStorage.getItem(GUIDE_KEY)!=='1';firstPickTipSeen=localStorage.getItem(FIRST_PICK_TIP_KEY)==='1'}catch{guideOpen=true;firstPickTipSeen=false}$('guideHelp').onclick=()=>{clearGuideTimer();guideOpen=!guideOpen;if(guideOpen)guideMode='rules';else markGuideSeen();updateGuide()};$('guideClose').onclick=()=>{clearGuideTimer();guideOpen=false;markGuideSeen();updateGuide()};$('langToggle').onclick=()=>{language=language==='en'?'zh':'en';updateLanguage()};window.addEventListener('keydown',e=>{let type=Object.keys(PIECES).find(k=>PIECES[k].key===e.key);if(type)select(type)});window.addEventListener('resize',fitBoard);$('btnRestart').onclick=reset;$('btnResetMain').onclick=reset;updateLanguage();fitBoard();reset();
  })();
  </script>
